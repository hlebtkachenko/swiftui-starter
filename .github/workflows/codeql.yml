name: codeql

# CodeQL's Swift extractor requires a full, tracer-wrapped build, and that build
# is inherently slow (~17 min on a macOS runner) for a SwiftUI app. The cost is
# the CodeQL tracer re-precompiling every imported system module (SwiftUI,
# CloudKit, CoreData, ...) on every run; it is NOT our own code, which
# compiles in seconds. This was measured: the same build untraced takes 30 s, and
# neither caching the precompiled modules nor pre-warming them before the traced
# build helped (the tracer redoes the work regardless).
#
# SUSPENDED as a PR gate since 2026-09-26: on the `xcode-27` runner image the
# Xcode 27 helpers (swift-plugin-server, sandbox-exec) are arm64-only, while
# CodeQL's Swift tracer drives the build as x86_64, so every macro expansion
# fails with "Bad CPU type in executable". This cannot be fixed in this repo,
# and the OS 27 floor rules out falling back to Xcode 26. Until CodeQL or the
# image fixes it, the scan runs only weekly and on demand as a probe, and
# `Analyze Swift` is not a required check. When a probe run succeeds, the
# `restore` job opens a PR that uncomments the `#restore:` lines below and puts
# `Analyze Swift` back into .github/rulesets/main.json.
#
# Once restored it is a required merge gate: security scanning of real Swift
# code was prioritized over merge speed (decision 2026-06-17).
on:
  #restore: push:
  #restore:   branches: [main]
  #restore: pull_request:
  #restore:   branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect Swift sources
    runs-on: ubuntu-latest
    # A job-level block replaces the workflow one, so repeat contents: read.
    permissions:
      contents: read
      actions: write
    outputs:
      has_swift: ${{ steps.check.outputs.has_swift }}
    steps:
      # GitHub disables scheduled workflows in a public repo after 60 days
      # without repository activity (this probe once went to
      # disabled_inactivity). Re-enabling is the documented fix: `gh workflow
      # enable` or PUT .../actions/workflows/{id}/enable, which "sets the state
      # of the workflow to active":
      # https://docs.github.com/en/actions/how-tos/manage-workflow-runs/disable-and-enable-workflows
      # https://docs.github.com/en/rest/actions/workflows#enable-a-workflow
      # The docs do not say whether this call resets the 60-day timer, so this
      # is best effort; continue-on-error keeps a failure here from skipping
      # the probe. Not on PRs: fork PRs get a read-only token.
      - name: Keep this scheduled probe enabled
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable codeql.yml --repo "$GITHUB_REPOSITORY"
      - uses: actions/checkout@v6
      - id: check
        run: |
          if [ -n "$(git ls-files '*.swift')" ]; then
            echo "has_swift=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_swift=false" >> "$GITHUB_OUTPUT"
            echo "No Swift sources yet; CodeQL analysis is skipped until code exists."
          fi

  analyze:
    name: Analyze Swift
    needs: detect
    if: needs.detect.outputs.has_swift == 'true'
    # The OS 27 floor needs the Xcode 27 SDK, which GitHub ships only on the
    # `xcode-27` image (preview); `macos-latest` still carries Xcode 26 only.
    # Return to `macos-latest` once it gains Xcode 27.
    runs-on: xcode-27
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode 27
        run: |
          # Use the image default Xcode 27 (the image also carries 27.x betas).
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -version | grep -q '^Xcode 27\.' || { echo "Xcode 27 not found on this runner"; exit 1; }
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
      - name: Build for analysis
        env:
          # Optional: forks need not set this secret. The build below disables
          # code signing (CODE_SIGNING_ALLOWED=NO), so no Team ID is required and
          # an unset secret simply writes an empty value. Set it only to trace a
          # signed build.
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          # Filesystem-synchronized groups don't enumerate sources in the pbxproj,
          # so the autobuilder finds no target; build explicitly. Build the leanest
          # product CodeQL can still trace: a single arch (ARCHS=arm64, the runner
          # is arm64) instead of a universal binary, no SwiftUI preview/debug-dylib,
          # no index store, no testability. A generic macOS destination builds
          # without hunting for a device. These trim a few minutes; the tracer's
          # system-module precompile is the irreducible floor (see header).
          printf 'DEVELOPMENT_TEAM = %s\n' "$DEVELOPMENT_TEAM" > Secrets.xcconfig
          xcodebuild build \
            -scheme AppName \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_PREVIEWS=NO \
            ENABLE_TESTABILITY=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"

  # While the PR gate is suspended (see header), a green probe run proves CodeQL
  # handles Xcode 27 again: open one PR that restores the triggers and the
  # required check. Idempotent: does nothing once restored or while the PR is open.
  # Needs Settings -> Actions -> "Allow GitHub Actions to create pull requests".
  restore:
    name: Propose CodeQL gate restore
    needs: analyze
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=ci/restore-codeql-gate
          grep -q '#restore: ' .github/workflows/codeql.yml || { echo "Gate already restored."; exit 0; }
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Restore branch already exists; see its PR."; exit 0
          fi
          sed -i 's/#restore: //' .github/workflows/codeql.yml
          jq '(.rules[] | select(.type == "required_status_checks") | .parameters.required_status_checks) += [{"context": "Analyze Swift"}]' \
            .github/rulesets/main.json > ruleset.tmp && mv ruleset.tmp .github/rulesets/main.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "ci: restore CodeQL as a required PR check"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "ci: restore CodeQL as a required PR check" \
            --body "A scheduled or manual CodeQL run on the Xcode 27 runner passed (run ${{ github.run_id }}), so the upstream arm64 tracer problem looks fixed. This PR re-enables the push and pull_request triggers and adds Analyze Swift back to the main ruleset file. Before merging: push an empty commit so the checks run (PRs opened by GITHUB_TOKEN do not trigger workflows), remove the SUSPENDED note from the workflow header, and update the CodeQL rows in docs/ci-cd.md, AGENTS.md and ADR-0014. After merging: run .github/scripts/setup-branch-protection.sh to apply the ruleset."
