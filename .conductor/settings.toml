"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

# Copy the gitignored per-user settings into every new Conductor workspace.
# Secrets.xcconfig holds DEVELOPMENT_TEAM and BUNDLE_ID_PREFIX and is never
# committed (public repo); without it, new worktrees fall back to com.example
# and code signing fails.
file_include_globs = "Secrets.xcconfig"

[scripts]
# Build or refresh the local CodeGraph index (.codegraph/, gitignored) in each new
# workspace. Skips quietly when the codegraph CLI is not installed.
setup = "if ! command -v codegraph >/dev/null 2>&1; then echo 'codegraph not installed, skipping index'; elif [ -d .codegraph ]; then codegraph sync; else codegraph init --yes; fi"
